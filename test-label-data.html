<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSLD Label Data Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">DSLD Label Data Test</h1>
    
    <div id="app" class="space-y-8">
      <div class="text-gray-600">Loading...</div>
    </div>
  </div>

  <script>
    async function loadProduct() {
      try {
        // Load ashwagandha products
        const response = await fetch('/api/products/supplements/ashwagandha.json');
        const data = await response.json();
        
        // Get first product with label data
        const product = data.products[0];
        
        if (!product || !product.dsld_label_info) {
          document.getElementById('app').innerHTML = `
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
              No label data found
            </div>
          `;
          return;
        }

        const { dsld_label_info } = product;

        // Render product info
        const html = `
          <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-bold mb-4">${product.product_name}</h2>
            <p class="text-gray-600 mb-2"><strong>Brand:</strong> ${product.brand}</p>
            <p class="text-gray-600 mb-2"><strong>DSLD ID:</strong> ${product.dsld_id}</p>
            <p class="text-gray-600 mb-6"><strong>Price:</strong> $${product.price_usd}</p>

            <div class="border-t pt-6">
              <h3 class="text-xl font-bold mb-4">Supplement Facts</h3>
              
              ${dsld_label_info.serving_size ? `
                <div class="mb-4">
                  <p class="text-sm text-gray-600">Serving Size: <strong>${dsld_label_info.serving_size}</strong></p>
                </div>
              ` : ''}

              <div class="border border-gray-300 rounded-lg overflow-hidden">
                <table class="w-full">
                  <thead class="bg-gray-100">
                    <tr>
                      <th class="text-left px-4 py-2 text-sm font-semibold">Ingredient</th>
                      <th class="text-right px-4 py-2 text-sm font-semibold">Amount</th>
                      <th class="text-right px-4 py-2 text-sm font-semibold">% Daily Value</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-200">
                    ${dsld_label_info.ingredients.map(ing => `
                      <tr>
                        <td class="px-4 py-3 text-sm">
                          ${ing.name}
                          ${ing.category ? `<span class="text-xs text-gray-500 ml-2">(${ing.category})</span>` : ''}
                        </td>
                        <td class="px-4 py-3 text-sm text-right">
                          ${ing.amount} ${ing.unit}
                        </td>
                        <td class="px-4 py-3 text-sm text-right font-semibold">
                          ${ing.daily_value ? `${ing.daily_value}%` : '†'}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              ${dsld_label_info.ingredients.some(i => !i.daily_value) ? `
                <p class="text-xs text-gray-500 mt-2">† Daily Value not established</p>
              ` : ''}

              ${dsld_label_info.other_ingredients && dsld_label_info.other_ingredients.length > 0 ? `
                <div class="mt-6">
                  <h4 class="text-sm font-semibold mb-2">Other Ingredients:</h4>
                  <p class="text-sm text-gray-700">${dsld_label_info.other_ingredients.join(', ')}</p>
                </div>
              ` : ''}
            </div>
          </div>

          <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
            ✅ DSLD label data successfully loaded and rendered!
          </div>
        `;

        document.getElementById('app').innerHTML = html;
        
      } catch (error) {
        document.getElementById('app').innerHTML = `
          <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
            <strong>Error:</strong> ${error.message}
          </div>
        `;
      }
    }

    loadProduct();
  </script>
</body>
</html>
