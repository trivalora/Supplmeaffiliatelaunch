<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Image Debug - Full Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #111; color: #0f0; padding-bottom: 50px; }
        
        #debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.95);
            padding: 15px;
            border: 2px solid #0f0;
            z-index: 10000;
            max-width: 500px;
            font-size: 11px;
            line-height: 1.5;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .error { color: #ff0000; }
        .warning { color: #ffaa00; }
        .success { color: #00ff00; }
        
        h2 {
            color: white;
            padding: 20px;
            background: #333;
            margin-top: 20px;
        }
        
        /* Test container - mimics actual landing page */
        #hero-test {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 600px;
            border: 5px solid red;
            margin-bottom: 50px;
            overflow: hidden; /* Added to see if overflow clips */
        }
        
        /* Add visual grid to see coverage */
        #hero-test::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 99px, rgba(255,0,0,0.3) 99px, rgba(255,0,0,0.3) 100px),
                repeating-linear-gradient(90deg, transparent, transparent 99px, rgba(255,0,0,0.3) 99px, rgba(255,0,0,0.3) 100px);
            pointer-events: none;
            z-index: 10;
        }
        
        /* Test with actual implementation structure */
        #hero-test .hero-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 3px solid yellow;
        }
        
        #hero-test picture {
            display: block;
            width: 100%;
            height: 100%;
            border: 3px solid cyan;
        }
        
        #hero-test img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            border: 3px solid blue;
        }
        
        /* Overlay elements to test if they're blocking */
        .overlay-test {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border: 2px dashed orange;
        }
        
        .content-test {
            position: relative;
            z-index: 10;
            color: white;
            text-align: center;
            padding: 50px;
            background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="debug-info">
        <h3 style="color: #00ff00; border-bottom: 2px solid #0f0; margin-bottom: 10px;">🔍 Hero Debug Analysis</h3>
        <div id="measurements"></div>
        <hr style="margin: 10px 0; border-color: #0f0;"/>
        <div id="elements-info"></div>
        <hr style="margin: 10px 0; border-color: #0f0;"/>
        <div id="computed-styles"></div>
    </div>
    
    <h2>Test: Actual Landing Page Structure with Visual Grid</h2>
    <div id="hero-test">
        <!-- Hero image with wrapper (like actual implementation) -->
        <div class="hero-wrapper">
            <picture>
                <source type="image/avif" 
                        srcset="/optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-640.avif 640w, 
                                /optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-1280.avif 1280w, 
                                /optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-1920.avif 1920w" 
                        sizes="100vw" />
                <source type="image/webp" 
                        srcset="/optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-640.webp 640w, 
                                /optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-1280.webp 1280w, 
                                /optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-1920.webp 1920w" 
                        sizes="100vw" />
                <img src="/optimized/adaa5958638ef58a10a2b5b182d161d011abc01a-1280.webp" 
                     alt="Hero test" 
                     id="img-test"
                     loading="eager" />
            </picture>
        </div>
        
        <!-- Gradient overlays (like actual landing page) -->
        <div class="overlay-test" style="background: linear-gradient(to bottom, rgba(42,38,34,0.65), rgba(58,54,50,0.6) 50%, rgba(58,54,50,0.7));"></div>
        <div class="overlay-test" style="background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(42,38,34,0.3) 100%);"></div>
        <div class="overlay-test" style="background-color: #162F1C; opacity: 0.35;"></div>
        
        <!-- Content on top -->
        <div class="content-test">
            <h1 style="font-size: 2rem; margin-bottom: 1rem;">Hero Content Layer</h1>
            <p>This should appear over the image</p>
        </div>
    </div>

    <script>
        function updateDebugInfo() {
            const heroTest = document.querySelector('#hero-test');
            const wrapper = document.querySelector('#hero-test .hero-wrapper');
            const picture = document.querySelector('#hero-test picture');
            const img = document.querySelector('#img-test');
            const overlays = document.querySelectorAll('#hero-test .overlay-test');
            
            const viewport = {
                width: window.innerWidth,
                height: window.innerHeight
            };
            
            // Get computed styles
            const heroStyles = heroTest ? window.getComputedStyle(heroTest) : null;
            const wrapperStyles = wrapper ? window.getComputedStyle(wrapper) : null;
            const pictureStyles = picture ? window.getComputedStyle(picture) : null;
            const imgStyles = img ? window.getComputedStyle(img) : null;
            
            // Check if image fills container
            const heroWidth = heroTest?.offsetWidth || 0;
            const imgWidth = img?.offsetWidth || 0;
            const widthMatch = Math.abs(heroWidth - imgWidth) < 2;
            const widthStatus = widthMatch ? 
                '<span class="success">✓ FULL WIDTH</span>' : 
                '<span class="error">✗ NOT FULL WIDTH</span>';
            
            // Check aspect ratio
            const imgAspect = img?.offsetWidth && img?.offsetHeight ? 
                (img.offsetWidth / img.offsetHeight).toFixed(2) : 'N/A';
            const naturalAspect = img?.naturalWidth && img?.naturalHeight ? 
                (img.naturalWidth / img.naturalHeight).toFixed(2) : 'N/A';
            
            const measurements = `
                <strong>Viewport:</strong> ${viewport.width}x${viewport.height}px<br/>
                <strong>Status:</strong> ${widthStatus}<br/>
                <br/>
                <strong>Hero Container (#hero-test):</strong><br/>
                &nbsp;&nbsp;Size: ${heroTest?.offsetWidth}x${heroTest?.offsetHeight}px<br/>
                &nbsp;&nbsp;Position: ${heroStyles?.position}<br/>
                &nbsp;&nbsp;Overflow: ${heroStyles?.overflow}<br/>
                <br/>
                <strong>Wrapper Div:</strong><br/>
                &nbsp;&nbsp;Size: ${wrapper?.offsetWidth}x${wrapper?.offsetHeight}px<br/>
                &nbsp;&nbsp;Position: ${wrapperStyles?.position}<br/>
                &nbsp;&nbsp;Inset: ${wrapperStyles?.inset}<br/>
                <br/>
                <strong>Picture Element:</strong><br/>
                &nbsp;&nbsp;Size: ${picture?.offsetWidth}x${picture?.offsetHeight}px<br/>
                &nbsp;&nbsp;Display: ${pictureStyles?.display}<br/>
                <br/>
                <strong>Img Element:</strong><br/>
                &nbsp;&nbsp;Rendered: ${img?.offsetWidth}x${img?.offsetHeight}px<br/>
                &nbsp;&nbsp;Natural: ${img?.naturalWidth}x${img?.naturalHeight}px<br/>
                &nbsp;&nbsp;Aspect (rendered): ${imgAspect}<br/>
                &nbsp;&nbsp;Aspect (natural): ${naturalAspect}<br/>
                &nbsp;&nbsp;Object-fit: ${imgStyles?.objectFit}<br/>
                &nbsp;&nbsp;Complete: ${img?.complete ? '<span class="success">YES</span>' : '<span class="error">NO</span>'}<br/>
                &nbsp;&nbsp;CurrentSrc: ${img?.currentSrc?.split('/').pop() || 'loading...'}<br/>
            `;
            
            const elementsInfo = `
                <strong>Z-Index Stack:</strong><br/>
                &nbsp;&nbsp;Hero: ${heroStyles?.zIndex}<br/>
                &nbsp;&nbsp;Wrapper: ${wrapperStyles?.zIndex}<br/>
                &nbsp;&nbsp;Picture: ${pictureStyles?.zIndex}<br/>
                &nbsp;&nbsp;Img: ${imgStyles?.zIndex}<br/>
                &nbsp;&nbsp;Overlays: ${overlays.length} elements<br/>
                <br/>
                <strong>Width Analysis:</strong><br/>
                &nbsp;&nbsp;Container: ${heroTest?.offsetWidth}px<br/>
                &nbsp;&nbsp;Wrapper: ${wrapper?.offsetWidth}px<br/>
                &nbsp;&nbsp;Picture: ${picture?.offsetWidth}px<br/>
                &nbsp;&nbsp;Img: ${img?.offsetWidth}px<br/>
                &nbsp;&nbsp;Difference: ${Math.abs((heroTest?.offsetWidth || 0) - (img?.offsetWidth || 0))}px<br/>
            `;
            
            const computedStyles = `
                <strong>Img Computed Styles:</strong><br/>
                &nbsp;&nbsp;width: ${imgStyles?.width}<br/>
                &nbsp;&nbsp;height: ${imgStyles?.height}<br/>
                &nbsp;&nbsp;position: ${imgStyles?.position}<br/>
                &nbsp;&nbsp;display: ${imgStyles?.display}<br/>
                &nbsp;&nbsp;object-fit: ${imgStyles?.objectFit}<br/>
                &nbsp;&nbsp;object-position: ${imgStyles?.objectPosition}<br/>
                <br/>
                <strong>Picture Computed Styles:</strong><br/>
                &nbsp;&nbsp;width: ${pictureStyles?.width}<br/>
                &nbsp;&nbsp;height: ${pictureStyles?.height}<br/>
                &nbsp;&nbsp;display: ${pictureStyles?.display}<br/>
            `;
            
            document.getElementById('measurements').innerHTML = measurements;
            document.getElementById('elements-info').innerHTML = elementsInfo;
            document.getElementById('computed-styles').innerHTML = computedStyles;
        }
        
        // Update on load and resize
        window.addEventListener('load', updateDebugInfo);
        window.addEventListener('resize', updateDebugInfo);
        
        // Also update when images load
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('load', () => {
                console.log('Image loaded:', img.currentSrc);
                updateDebugInfo();
            });
            img.addEventListener('error', (e) => {
                console.error('Image failed to load:', e);
                updateDebugInfo();
            });
        });
        
        // Initial update
        setTimeout(updateDebugInfo, 100);
        
        // Update periodically
        setInterval(updateDebugInfo, 2000);
    </script>
</body>
</html>
