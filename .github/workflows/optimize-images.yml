name: Optimize Images and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  optimize-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run image optimizer
        run: npm run images

      - name: Create Pull Request if optimized images changed
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(images): add optimized images from CI"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          base: main
          branch: ci/optimized-images
          title: "chore(images): add optimized images from CI"
          body: |
            This PR was created automatically by GitHub Actions.
            It includes optimized image assets generated by the CI image pipeline.
          labels: "automated,images"

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
